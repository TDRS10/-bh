name: Build Android App (Capacitor)

# Builds the native Android app (Capacitor) from the same web sources.
# The app loads the PWA from GitHub Pages, so every push shows up instantly.
#
# Result: a signed APK available as a build artifact.
# To publish on Google Play, connect this workflow to the Play Console.

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Grant Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Install dependencies
        run: npm ci --no-audit --no-fund || npm install --no-audit --no-fund

      - name: Prepare the web bundle
        run: |
          mkdir -p www
          cp index.html app.js styles.css manifest.json service-worker.js \
             firebase-config.js firebase-service.js native-bridge.js \
             icon-192.png icon-512.png logo.jpg www/
          cp -r .well-known www/ 2>/dev/null || true
          cp native-bridge.js www/capacitor-bridge.js

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Generate the Android launcher icons + splash
        run: node scripts/make-android-icons.js

      - name: Decode signing keystore
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_B64" | base64 -d > keystore-backup.keystore

      - name: Build the APK
        env:
          BH_KEYSTORE_PATH: keystore-backup.keystore
          BH_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          BH_KEY_ALIAS: bh
          BH_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon

      - name: Sign the APK
        run: |
          BUILD_TOOLS="$ANDROID_HOME/build-tools/36.1.0"
          "$BUILD_TOOLS/zipalign" -f 4 \
            android/app/build/outputs/apk/release/app-release-unsigned.apk \
            android/app/build/outputs/apk/release/app-release-aligned.apk
          "$BUILD_TOOLS/apksigner" sign \
            --ks keystore-backup.keystore \
            --ks-key-alias bh \
            --ks-pass "pass:${{ secrets.KEYSTORE_PASSWORD }}" \
            --key-pass "pass:${{ secrets.KEY_PASSWORD }}" \
            --out android/app/build/outputs/apk/release/BH-Finance.apk \
            android/app/build/outputs/apk/release/app-release-aligned.apk
          "$BUILD_TOOLS/apksigner" verify --print-certs android/app/build/outputs/apk/release/BH-Finance.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: BH-Finance-APK
          path: android/app/build/outputs/apk/release/BH-Finance.apk
          if-no-files-found: error
